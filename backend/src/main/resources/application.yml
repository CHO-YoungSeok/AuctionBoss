server:
  port: 8080

spring:
  application:
    name: backend
  datasource:
    hikari:
      # 연결을 못 얻을 때 헬스체크가 오래 매달리지 않도록 짧게 둔다.
      connection-timeout: 5000
      # 시간대는 세 층에서 UTC로 고정한다: JVM(BackendApplication), Hibernate(jdbc.time_zone),
      # JDBC 드라이버(여기). 드라이버 설정을 프로필별 URL이 아니라 공통에 두어야
      # Testcontainers(@ServiceConnection) 접속에도 똑같이 적용된다.
      data-source-properties:
        connectionTimeZone: UTC
        forceConnectionTimeZoneToSession: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    # 시각(Instant)은 common/json의 전용 직렬화기가 항상 밀리초 3자리 UTC(.SSSZ)로 쓴다.
    default-property-inclusion: always
