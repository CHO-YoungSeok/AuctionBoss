# config/collector.json의 사본(백엔드가 /app/config/collector.json으로 읽는다).
# 원본과 달라지지 않게 deploy-config.test.ts가 내용 일치를 확인한다. 원본을 고치면 여기도 고친다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: auctionboss-collector-config
  namespace: auctionboss
data:
  collector.json: |
    {
      "scope": {
        "courts": [
          { "name": "서울중앙지방법원", "courtCode": "B000210" },
          { "name": "서울동부지방법원", "courtCode": "B000211" },
          { "name": "서울남부지방법원", "courtCode": "B000212" },
          { "name": "서울서부지방법원", "courtCode": "B000215" },
          { "name": "서울북부지방법원", "courtCode": "B000213" }
        ],
        "maxCourtsPerRun": 1,
        "maxRequestsPerRun": 13
      },
      "intervalMs": 600000,
      "analysis": {
        "maxItemsPerRun": 5,
        "maxReanalysisPerRun": 2,
        "reanalysisCooldownHours": 24,
        "intervalMs": 600000
      },
      "photos": {
        "intervalMs": 1800000,
        "maxItemsPerRun": 5,
        "requestDelayMs": 30000,
        "retryAfterHours": 24
      },
      "observability": {
        "maxRunsPerWorker": 1000,
        "staleAfterIntervals": 3
      }
    }
