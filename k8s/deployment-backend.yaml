# 백엔드: 수집·사진 주기 실행과 API를 맡는 유일한 수집기. 인스턴스 하나, 업데이트 때 이전 것을 먼저 내린다.
# prod 프로필은 MySQL에 이전 완료 표식이 없으면 기동을 거부한다(docs/REFERENCE.md 전환 런북 먼저).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auctionboss-backend
  namespace: auctionboss
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: auctionboss
      component: backend
  template:
    metadata:
      labels:
        app: auctionboss
        component: backend
    spec:
      # 사진 PVC는 root 소유로 만들어지는 경우가 많다. 이미지의 비루트 사용자(uid 10001)가 쓸 수 있게 그룹을 맞춘다.
      securityContext:
        fsGroup: 10001
      containers:
        - name: backend
          image: auctionboss-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: DB_HOST
              value: "auctionboss-mysql"
            - name: DB_PORT
              value: "3306"
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: auctionboss-secret
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: auctionboss-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: auctionboss-secret
                  key: DB_PASSWORD
            - name: AUCTIONBOSS_CONFIG_PATH
              value: "/app/config/collector.json"
            - name: AUCTIONBOSS_COLLECTOR_ENABLED
              value: "true"
            - name: AUCTIONBOSS_PHOTOS_ENABLED
              value: "true"
            - name: AUCTIONBOSS_SOURCE_EXTERNAL_REQUESTS_ALLOWED
              value: "true"
            - name: AUCTIONBOSS_PHOTOS_DIR
              value: "/app/photos"
          volumeMounts:
            - name: photos
              mountPath: /app/photos
            - name: collector-config
              mountPath: /app/config
              readOnly: true
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
      volumes:
        - name: photos
          persistentVolumeClaim:
            claimName: auctionboss-photos-pvc
        - name: collector-config
          configMap:
            name: auctionboss-collector-config
