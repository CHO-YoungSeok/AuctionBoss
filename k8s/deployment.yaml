apiVersion: apps/v1
kind: Deployment
metadata:
  name: auctionboss-web-collector
  namespace: auctionboss
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auctionboss
      component: web-collector
  template:
    metadata:
      labels:
        app: auctionboss
        component: web-collector
    spec:
      containers:
        - name: web
          image: auctionboss:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: auctionboss-config
            - secretRef:
                name: auctionboss-secret
          volumeMounts:
            - name: data-volume
              mountPath: /app/data
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
              
        - name: collector
          image: auctionboss:latest
          imagePullPolicy: IfNotPresent
          command: ["npm", "run", "collector"]
          envFrom:
            - configMapRef:
                name: auctionboss-config
            - secretRef:
                name: auctionboss-secret
          volumeMounts:
            - name: data-volume
              mountPath: /app/data
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

        # SQLite 파일·사진 디렉터리를 쓰므로 web·collector와 같은 Pod에서 같은 PVC를 공유한다.
        - name: photos
          image: auctionboss:latest
          imagePullPolicy: IfNotPresent
          command: ["npm", "run", "photos"]
          envFrom:
            - configMapRef:
                name: auctionboss-config
            - secretRef:
                name: auctionboss-secret
          volumeMounts:
            - name: data-volume
              mountPath: /app/data
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
      volumes:
        - name: data-volume
          persistentVolumeClaim:
            claimName: auctionboss-data-pvc
