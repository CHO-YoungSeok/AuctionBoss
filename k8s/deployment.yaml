# 웹: 단일 컨테이너. 데이터 볼륨·SQLite 없음 - 데이터 원천은 백엔드(spring)다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auctionboss-web
  namespace: auctionboss
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auctionboss
      component: web
  template:
    metadata:
      labels:
        app: auctionboss
        component: web
    spec:
      containers:
        - name: web
          image: auctionboss:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: auctionboss-config
          env:
            - name: AUCTIONBOSS_DATA_SOURCE
              value: "spring"
            - name: AUCTIONBOSS_SPRING_BASE
              value: "http://auctionboss-backend:8080"
          # 백엔드가 잠시 내려가도 웹 컨테이너를 재시작하지 않는다(재시작해도 낫지 않는다): liveness는 포트만 본다.
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          # 트래픽 수신 가능 여부는 /api/health(백엔드 헬스체크로 판정)로 본다.
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
