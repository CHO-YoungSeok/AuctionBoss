apiVersion: apps/v1
kind: Deployment
metadata:
  name: auctionboss-analyzer
  namespace: auctionboss
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auctionboss
      component: analyzer
  template:
    metadata:
      labels:
        app: auctionboss
        component: analyzer
    spec:
      containers:
        - name: analyzer
          image: auctionboss:latest
          imagePullPolicy: IfNotPresent
          command: ["npm", "run", "analyzer"]
          envFrom:
            - configMapRef:
                name: auctionboss-config
          env:
            - name: AUCTIONBOSS_API_BASE
              value: "http://auctionboss-backend:8080"
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: auctionboss-secret
                  key: ANTHROPIC_API_KEY
                  optional: true
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
