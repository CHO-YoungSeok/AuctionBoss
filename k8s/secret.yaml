apiVersion: v1
kind: Secret
metadata:
  name: auctionboss-secret
  namespace: auctionboss
type: Opaque
# 이 파일에는 값을 두지 않는다(키 이름만). 값은 클러스터에서 직접 만든다:
#   kubectl -n auctionboss create secret generic auctionboss-secret \
#     --from-literal=MYSQL_ROOT_PASSWORD='...' --from-literal=DB_NAME='...' \
#     --from-literal=DB_USER='...' --from-literal=DB_PASSWORD='...' \
#     --from-literal=ANTHROPIC_API_KEY='...'
# 필요한 키: MYSQL_ROOT_PASSWORD, DB_NAME, DB_USER, DB_PASSWORD(MySQL·백엔드),
#            ANTHROPIC_API_KEY(분석 워커 API 모드용. 컨테이너에는 Claude CLI가 없어 사실상 필요)
data: {}
