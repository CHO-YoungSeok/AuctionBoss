name: CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Type check
        run: npx tsc --noEmit
        
      - name: Run tests
        run: npm test
        
      - name: Build
        run: npm run build
        
      - name: Lint
        run: npm run lint

  openspec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 로컬과 같은 버전으로 고정한다.
      - name: Validate specs
        run: npx -y @fission-ai/openspec@1.12.0 validate --specs --strict --no-interactive

      - name: Validate active changes
        run: npx -y @fission-ai/openspec@1.12.0 validate --changes --strict --no-interactive

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # 계약 테스트가 저장소 루트의 config/collector.json을 ../config 로 찾는다(작업 디렉터리 backend/).
      # Testcontainers는 러너의 Docker를 쓴다.
      - name: Gradle check
        working-directory: backend
        run: ./gradlew check --no-daemon
