# 운영 전환 리허설 덮어쓰기(migrate-data-and-cutover D13). 운영 docker-compose.yml과 함께 쓴다:
#   docker compose -p auctionboss-rehearsal -f docker-compose.yml -f scripts/dev/rehearsal.override.yml ...
# 실제로는 scripts/dev/rehearse-cutover.sh가 이 명령을 감싼다. 운영 프로젝트(auctionboss)와는 프로젝트 이름·볼륨·포트가 모두 다르다.
#
# 실제 법원 사이트에는 요청하지 않는다:
#  - 소스 주소는 루프백 가짜 서버(source-fake)이고, 외부 요청 허용은 꺼 둔다(루프백만 통과, 4단계 D4).
#  - 가짜 서버는 backend와 같은 네트워크 네임스페이스(network_mode: service:backend)의 127.0.0.1에서 받는다.
#    같은 compose 네트워크의 다른 컨테이너 이름이나 host.docker.internal은 루프백이 아니라 거절되므로 이 배치뿐이다.
#  - 분석 워커의 claude는 가짜 CLI(scripts/dev/fake-claude)이고 API 키는 비운다. 실제 Claude 호출 0.
# `!override`는 목록을 합치지 않고 통째로 바꾼다(운영 파일의 호스트 포트 8080·3000을 쓰지 않기 위해).
services:
  mysql:
    ports: !override
      - "127.0.0.1:${REHEARSAL_MYSQL_PORT:-13307}:3306"

  backend:
    ports: !override
      - "127.0.0.1:${REHEARSAL_BACKEND_PORT:-18080}:8080"
    environment:
      AUCTIONBOSS_SOURCE_EXTERNAL_REQUESTS_ALLOWED: "false"
      AUCTIONBOSS_SOURCE_BASE_URL: "http://127.0.0.1:19090"
      # 첫 틱은 주기(1분) 뒤다: 사이드카 가짜 서버가 뜬 뒤에 돌게 한다.
      AUCTIONBOSS_COLLECTOR_RUN_IMMEDIATELY: "false"
      AUCTIONBOSS_PHOTOS_RUN_IMMEDIATELY: "false"
    volumes:
      - ./scripts/dev/rehearsal-collector.json:/app/config/collector.json:ro

  source-fake:
    build: .
    network_mode: "service:backend"
    volumes:
      - ./scripts:/app/scripts:ro
    command:
      # npx는 npm 레지스트리에 접속할 수 있어(외부 연결) 쓰지 않는다. 이미지에 설치된 tsx를 직접 부른다.
      - /app/node_modules/.bin/tsx
      - --tsconfig
      - scripts/dev/tsconfig.snapshot.json
      - scripts/dev/fake-source-server.ts
      - --port-file
      - /tmp/fake-source.port
      - --port
      - "19090"
      - --log
      - /tmp/fake-source.requests.jsonl

  web:
    ports: !override
      - "127.0.0.1:${REHEARSAL_WEB_PORT:-13000}:3000"

  analyzer:
    environment:
      ANTHROPIC_API_KEY: ""
      AUCTIONBOSS_CLAUDE_BIN: /app/scripts/dev/fake-claude
    volumes:
      - ./scripts:/app/scripts:ro
      - ./scripts/dev/rehearsal-collector.json:/app/config/collector.json:ro
