version: "3.8"

services:
  web:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - auctionboss-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
      - NODE_ENV=production
      - AUCTIONBOSS_DB=/app/data/auctionboss.db

  collector:
    build: .
    command: npm run collector
    volumes:
      - auctionboss-data:/app/data
    depends_on:
      - web
    environment:
      - NODE_ENV=production
      - AUCTIONBOSS_DB=/app/data/auctionboss.db

  analyzer:
    build: .
    command: npm run analyzer
    depends_on:
      - web
    environment:
      - NODE_ENV=production
      - BASE_URL=http://web:3000

volumes:
  auctionboss-data:
