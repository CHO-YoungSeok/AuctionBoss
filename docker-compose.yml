version: "3.8"

services:
  web:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - auctionboss-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
      - NODE_ENV=production
      - AUCTIONBOSS_DB=/app/data/auctionboss.db

  collector:
    build: .
    command: npm run collector
    volumes:
      - auctionboss-data:/app/data
    depends_on:
      - web
    environment:
      - NODE_ENV=production
      - AUCTIONBOSS_DB=/app/data/auctionboss.db

  analyzer:
    build: .
    command: npm run analyzer
    depends_on:
      - web
    environment:
      - NODE_ENV=production
      - BASE_URL=http://web:3000

  # --- Spring Boot + MySQL 백엔드 (기존 web/collector/analyzer와 독립) ---
  mysql:
    image: mysql:8.4
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?.env에 MYSQL_ROOT_PASSWORD가 필요합니다}
      MYSQL_DATABASE: ${DB_NAME:?.env에 DB_NAME이 필요합니다}
      MYSQL_USER: ${DB_USER:?.env에 DB_USER가 필요합니다}
      MYSQL_PASSWORD: ${DB_PASSWORD:?.env에 DB_PASSWORD가 필요합니다}
    volumes:
      - mysql-data:/var/lib/mysql
    # 호스트 3306은 로컬 개발용 MySQL이 쓰는 경우가 많아 기본 3307로 연다(로컬 루프백만).
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  backend:
    build: ./backend
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local,seed
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      AUCTIONBOSS_CONFIG_PATH: /app/config/collector.json
    volumes:
      - ./config/collector.json:/app/config/collector.json:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s

volumes:
  auctionboss-data:
  mysql-data:
