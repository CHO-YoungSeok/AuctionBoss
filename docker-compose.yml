version: "3.8"

services:
  web:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - auctionboss-data:/app/data
    healthcheck:
      # 이미지에 curl이 없으므로 Node 22 전역 fetch로 확인한다. 200이 아니면 실패.
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    environment:
      - NODE_ENV=production
      - AUCTIONBOSS_DB=/app/data/auctionboss.db

  collector:
    build: .
    command: npm run collector
    volumes:
      - auctionboss-data:/app/data
    depends_on:
      web:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - AUCTIONBOSS_DB=/app/data/auctionboss.db

  photos:
    build: .
    command: npm run photos
    volumes:
      - auctionboss-data:/app/data
    depends_on:
      web:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - AUCTIONBOSS_DB=/app/data/auctionboss.db

  analyzer:
    build: .
    command: npm run analyzer
    depends_on:
      - web
    # ${VAR:-}: 값이 없어도 compose 파일 전체 해석이 실패하지 않는다(빈 키는 CLI 모드로 간다).
    environment:
      - NODE_ENV=production
      - AUCTIONBOSS_API_BASE=http://web:3000
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - AUCTIONBOSS_ANALYZE_MODEL=${AUCTIONBOSS_ANALYZE_MODEL:-}

  # --- Spring Boot + MySQL 백엔드 (기존 web/collector/analyzer와 독립) ---
  mysql:
    image: mysql:8.4
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    # 값은 .env에서 주입한다(cp .env.example .env). `:?`(필수 검사)를 쓰지 않는 이유:
    # compose는 파일 전체를 한 번에 치환하므로 `:?`가 있으면 .env가 없을 때 기존 web/collector/
    # analyzer까지 실행할 수 없게 된다. 값이 비면 MySQL 컨테이너가 기동 시점에
    # "password option is not specified"로 스스로 실패하므로 비밀은 여전히 저장소에 두지 않는다.
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-}
      MYSQL_DATABASE: ${DB_NAME:-}
      MYSQL_USER: ${DB_USER:-}
      MYSQL_PASSWORD: ${DB_PASSWORD:-}
    volumes:
      - mysql-data:/var/lib/mysql
    # 호스트 3306은 로컬 개발용 MySQL이 쓰는 경우가 많아 기본 3307로 연다(로컬 루프백만).
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  backend:
    build: ./backend
    depends_on:
      mysql:
        condition: service_healthy
    # 로컬 루프백에만 연다. 인증이 없는 API라 같은 네트워크의 다른 기기에 노출하지 않는다.
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local,seed
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-}
      DB_USER: ${DB_USER:-}
      DB_PASSWORD: ${DB_PASSWORD:-}
      AUCTIONBOSS_CONFIG_PATH: /app/config/collector.json
    volumes:
      - ./config/collector.json:/app/config/collector.json:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s

volumes:
  auctionboss-data:
  mysql-data:
